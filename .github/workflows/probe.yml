name: macos-probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: info
        run: |
          echo "label=${{ matrix.os }}"
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu hw.memsize
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "runner=$RUNNER_NAME"
