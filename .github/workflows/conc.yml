name: concurrency-probe
run-name: conc ${{ inputs.os }} ${{ inputs.list }}
on:
  workflow_dispatch:
    inputs:
      os:
        required: true
      list:
        required: true
        default: "[1,2,3,4,5]"
      secs:
        required: true
        default: "180"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(inputs.list) }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    steps:
      - run: sleep ${{ inputs.secs }}
        shell: bash
